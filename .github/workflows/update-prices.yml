name: Update prices

on:
  schedule:
    # 09:00 / 21:00 JST (= 00:00 / 12:00 UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Yuyutei prices
        run: python fetch_yuyutei.py --all --delay 1.0

      - name: Validate cards.json
        run: python scripts/validate_cards.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards.json public/meta.json cards.json meta.json
          if git diff --staged --quiet; then
            echo "No price changes"
          else
            git commit -m "chore: update card prices"
            git push
          fi

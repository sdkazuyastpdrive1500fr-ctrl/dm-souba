name: Update prices

# 自動スケジュールは停止中（遊々亭が GitHub Actions IP を 403 するため）。
# 価格更新はローカルの update_prices.bat を使う。
# 再開するときは下の schedule を有効化する。
on:
  workflow_dispatch:
  # schedule:
  #   # 09:00 / 21:00 JST (= 00:00 / 12:00 UTC)
  #   - cron: "0 0,12 * * *"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Yuyutei reachability
        run: |
          echo "runner egress IP: $(curl -sS --max-time 15 https://api.ipify.org || echo unknown)"
          status=$(curl -sS -o /tmp/yuyutei.html -w '%{http_code}' --max-time 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            'https://yuyu-tei.jp/buy/dm/s/sale' || echo 000)
          echo "yuyu-tei.jp status: $status"
          echo "response head:"
          head -c 300 /tmp/yuyutei.html || true

      - name: Fetch Yuyutei prices
        run: python fetch_yuyutei.py --all --delay 2.0

      - name: Validate cards.json
        run: python scripts/validate_cards.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards.json public/meta.json cards.json meta.json
          if git diff --staged --quiet; then
            echo "No price changes"
          else
            git commit -m "chore: update card prices"
            git push
          fi
